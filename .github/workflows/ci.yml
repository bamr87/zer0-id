name: CI

# Adopted from bamr87/bamr87 via standardize-fanout.yml. This is a thin caller —
# the gate logic is shared and versioned in
# bamr87/bamr87/.github/workflows/standard-ci.yml. Don't edit the logic here.
# (main is substituted with the repo's default branch on adoption.)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: bamr87/bamr87/.github/workflows/standard-ci.yml@v2
    secrets: inherit

  # Stack-specific build/test (standard-ci@v2 auto-detects node/python/ruby only).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: 'go vet ./... && go test ./... && go build ./...'
